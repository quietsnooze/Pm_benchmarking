[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uk_stress_benchmark"
version = "0.1.0"
description = "UK bank stress-test benchmarking against Bank of England ACS scenarios."
requires-python = ">=3.12"
dependencies = [
    "streamlit",
    "pandas",
    "plotly",
    "statsmodels",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pyright==1.1.411",
    "pdfplumber>=0.11.9",
    "openpyxl>=3.1.5",
    "playwright>=1.61.0",
]

[project.scripts]
sync-sources = "uk_stress_benchmark.sync_sources:main"
extract-tables = "uk_stress_benchmark.extract_appendix_tables:main"
extract-scenarios = "uk_stress_benchmark.extract_scenarios:main"
aggregate-firm-results = "uk_stress_benchmark.aggregate_firm_results:main"
extract-provisions = "uk_stress_benchmark.extract_provisions:main"
ingest = "uk_stress_benchmark.ingest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# Pin first-party detection so import grouping is identical locally and in CI.
# Without this, ruff's auto-detection of the src-layout package can differ by
# environment, producing I001 only in one place.
known-first-party = ["uk_stress_benchmark"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures often hold verbatim source-data lines that legitimately exceed
# the line-length budget; relaxing E501 there keeps the fixture faithful.
"tests/**" = ["E501"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
